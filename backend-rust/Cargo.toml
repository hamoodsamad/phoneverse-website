[package]
name = "phoneverse-backend"
version = "1.0.0"
edition = "2021"
authors = ["PhoneVerse Engineering Team <dev@phoneverse.com>"]
description = "High-performance Axum REST API backend for PhoneVerse 2026 Smartphone Intelligence & Commerce Platform"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "multipart"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "chrono", "uuid", "json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["serde", "v4"] }
jsonwebtoken = "9.3"
bcrypt = "0.15"
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
tokio-cron-scheduler = "0.10"
anyhow = "1.0"
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
